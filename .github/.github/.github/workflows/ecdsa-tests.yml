name: Electric Money - ECDSA Security Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecdsa:
    name: ECDSA / SECP256k1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ecdsa==0.19.1" "pytest>=8,<9"

      - name: Run ECDSA security tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_ecdsa.py
